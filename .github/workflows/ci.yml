name: CI

on:
  push:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Собрать симулятор CI
        run: go vet ./tools/... && go build -o bin/ci ./tools/ci

      # На main модули по задумке красные (это задания), поэтому
      # проверяем только модули, файлы которых изменились в пуше/PR.
      - name: Найти изменённые модули
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BEFORE"
          else
            # новая ветка: сравниваем с main
            BASE="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi

          if [ -z "$BASE" ]; then
            MODULES=""
          else
            MODULES="$(git diff --name-only "$BASE" HEAD \
              | grep -oE '^[0-9]{2}-' | cut -c1-2 | sort -u | tr '\n' ' ')"
          fi

          echo "Изменённые модули: ${MODULES:-нет}"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

      - name: Прогнать пайплайн модулей
        if: steps.changed.outputs.modules != ''
        env:
          MODULES: ${{ steps.changed.outputs.modules }}
        run: |
          status=0
          for m in $MODULES; do
            ./bin/ci "$m" || status=1
          done
          exit $status
